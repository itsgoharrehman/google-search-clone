name: Bug Report
description: Report a visual defect, layout mismatch, or form behavior issue.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide detailed reproduction information for the visual or layout bug.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser version, operating system, and viewport size.
      placeholder: "e.g., Firefox 125 on macOS 14.4 (1920x1080)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to encounter the issue.
      placeholder: |
        1. Open advanced.html
        2. Resize viewport below 600px
        3. Observe text overlapping input fields
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should the layout look like?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What does the layout currently display?
    validations:
      required: true
